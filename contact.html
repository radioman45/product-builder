<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제휴 문의</title>
  <meta name="description" content="조코딩 소개 페이지 제휴 문의 양식입니다." />
  <meta name="color-scheme" content="light dark" />
  <script src="theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    /* 색상 토큰 */
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1a1d24;
      --text-muted: #5b6270;
      --accent: #2f6bff;
      --border: #e3e6ec;
      --success: #1f9d55;
      --error: #d93636;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1115;
        --card: #171a21;
        --text: #eceef2;
        --text-muted: #a0a7b4;
        --accent: #6b95ff;
        --border: #2a2f3a;
        --success: #4cc38a;
        --error: #ff6b6b;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1115;
      --card: #171a21;
      --text: #eceef2;
      --text-muted: #a0a7b4;
      --accent: #6b95ff;
      --border: #2a2f3a;
      --success: #4cc38a;
      --error: #ff6b6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Sans KR", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      word-break: keep-all;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .wrap {
      width: 100%;
      max-width: 560px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .back {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back:hover { color: var(--accent); }

    /* 테마 전환 버튼 */
    .theme-toggle {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .theme-toggle:hover { transform: rotate(-15deg); }

    h1 {
      font-size: clamp(1.75rem, 6vw, 2.25rem);
      font-weight: 900;
      margin-bottom: 6px;
    }
    .subtitle {
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .disclaimer {
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 10px 14px;
      border-left: 3px solid var(--accent);
      background: var(--card);
      border-radius: 6px;
      margin-bottom: 24px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    /* 폼 */
    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 6px;
    }
    .field label .req { color: var(--error); margin-left: 2px; }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      font: inherit;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.15s ease;
    }
    .field textarea {
      min-height: 140px;
      resize: vertical;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* 스팸 방지용 숨김 필드 */
    .hp { position: absolute; left: -9999px; }

    .btn {
      width: 100%;
      font: inherit;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.92; }
    .btn:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .status {
      margin-top: 16px;
      font-size: 0.95rem;
      text-align: center;
      min-height: 1.5em;
    }
    .status.success { color: var(--success); }
    .status.error { color: var(--error); }

    .notice {
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-align: center;
    }

    @media (max-width: 420px) {
      .panel { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="index.html">← 조코딩 소개로 돌아가기</a>
      <button class="theme-toggle" type="button" aria-label="테마 전환">🌙</button>
    </div>

    <h1>🤝 제휴 문의</h1>
    <p class="subtitle">이 팬 페이지 운영자에게 협업·광고 등 제휴 제안을 남겨 주시면 확인 후 이메일로 답변드릴게요.</p>
    <p class="disclaimer">※ 이 사이트는 비공식 팬 페이지로 조코딩 채널과 관련이 없습니다. 조코딩 채널에 직접 연락하시려면 공식 유튜브 채널의 안내를 이용해 주세요.</p>

    <div class="panel">
      <form id="contactForm" action="https://formspree.io/f/xeaoknvr" method="POST">
        <div class="field">
          <label for="name">이름<span class="req">*</span></label>
          <input id="name" name="name" type="text" required maxlength="50" autocomplete="name" />
        </div>

        <div class="field">
          <label for="email">이메일<span class="req">*</span></label>
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="답변받을 이메일 주소" />
        </div>

        <div class="field">
          <label for="company">회사/단체명</label>
          <input id="company" name="company" type="text" maxlength="100" autocomplete="organization" />
        </div>

        <div class="field">
          <label for="type">문의 유형<span class="req">*</span></label>
          <select id="type" name="type" required>
            <option value="">선택해 주세요</option>
            <option value="광고·협찬">광고·협찬</option>
            <option value="콘텐츠 협업">콘텐츠 협업</option>
            <option value="강의·강연">강의·강연</option>
            <option value="기타">기타</option>
          </select>
        </div>

        <div class="field">
          <label for="message">문의 내용<span class="req">*</span></label>
          <textarea id="message" name="message" required maxlength="3000" placeholder="제안 내용, 일정, 예산 등을 자유롭게 적어 주세요."></textarea>
        </div>

        <!-- Formspree 설정: 메일 제목, 스팸 봇 차단 -->
        <input type="hidden" name="_subject" value="[제휴 문의] 새 문의가 도착했습니다" />
        <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" />

        <button class="btn" id="submitBtn" type="submit">문의 보내기</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </div>

    <p class="notice">입력하신 정보(이름·이메일·회사명·문의 내용)는 폼 전송 서비스 Formspree(미국)를 거쳐 운영자에게 전달되며, 문의 답변 목적으로만 사용됩니다.</p>
  </div>

  <script>
    const form = document.getElementById("contactForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = "status " + type;
    }

    // 페이지 이동 없이 Formspree로 전송하고 결과를 바로 보여 준다
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "보내는 중...";
      setStatus("", "");

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: { Accept: "application/json" },
          // 응답이 없을 때 버튼이 계속 잠기지 않도록 15초 제한
          signal: AbortSignal.timeout(15000),
        });

        if (response.ok) {
          form.reset();
          setStatus("문의가 접수되었습니다. 빠르게 확인 후 연락드릴게요!", "success");
        } else {
          const data = await response.json().catch(() => ({}));
          const detail = Array.isArray(data.errors)
            ? data.errors.map((e) => e.message).join(", ")
            : data.error || "";
          setStatus("전송에 실패했어요. " + (detail || "잠시 후 다시 시도해 주세요."), "error");
        }
      } catch (error) {
        const timedOut = error.name === "TimeoutError" || error.name === "AbortError";
        setStatus(
          timedOut ? "응답이 지연되고 있어요. 잠시 후 다시 시도해 주세요." : "네트워크 오류가 발생했어요. 인터넷 연결을 확인해 주세요.",
          "error"
        );
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "문의 보내기";
      }
    });
  </script>
</body>
</html>
